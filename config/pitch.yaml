# Pitch writes messages to streamers and podcasters who might pay you to clip their content.
# Pitch only DRAFTS. You approve each one, then send it yourself. Never automate sending: platforms ban
# accounts that do, and spam laws apply to cold email.
#
# Fill in sender_name before Pitch drafts anything.

sender_name: ""                 # how you sign the message, e.g. "Steven"
about_me: ""                    # one honest line, e.g. "I run clipping accounts for Twitch streamers". Leave blank if unsure.
what_you_offer: "Short vertical clips of your best moments, with captions, posted to TikTok, YouTube Shorts and Instagram Reels."
price: ""                       # e.g. "$250 a month for 10 clips". Blank means Pitch won't mention a price.
portfolio_url: ""               # link to your clipping account or best clips, if you have one
second_offer: ""              # optional cheaper offer Pitch adds, e.g. "Recap: a YouTube title, description, chapters and 5 post ideas for each long video, $49 a month for 4. For podcasters: \"Clip pack: 5 captioned vertical clips plus titles and post ideas from one episode, $49 once\""
# Monthly clip package (the paid offer). Pitch adds the offer line to drafts when this is on.
monthly_package: true
package_clips: 12
package_price: 79
package_revisions: 2
payment_link: ""                # paste the Stripe payment link here (make it in test mode first); only https://buy.stripe.com links are used

free_sample: true               # offer to make one clip for them free
opt_out_line: "If this isn't for you, just say so and I won't message again."

# Sending by email (needs the Gmail settings on the Settings page). You still approve every message first.
postal_address: ""              # required to send email: spam law wants a real postal address (a PO box is fine)
daily_send_cap: 10              # most emails Pitch sends in 24 hours (never more than 20)

# Finding streamers on Twitch (needs the Twitch app keys in .env)
daily_leads: 5                  # how many new pitches to draft per run
min_viewers: 50
max_viewers: 2000
language: en
min_score: 4                    # leads Pitch scores under this (1 to 10) are skipped and hidden from the review list
auto_find: false                # true = draft new pitches once a day on its own

# Follow-ups
followup_days: 4                # remind you to follow up this many days after you send a pitch
max_followups: 2
